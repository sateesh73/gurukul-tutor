spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USERNAME:authuser}
    password: ${DB_PASSWORD:authpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: "/actuator"
    exposure:
      include: "health,info,metrics,env"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gurukul.authservice: DEBUG
    org.springframework: INFO
    org.hibernate: DEBUG