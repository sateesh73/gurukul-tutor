spring:
  application:
    name: auth-service
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/gurukul}
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:gurukul}/protocol/openid-connect/certs

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: "/actuator"
    exposure:
      include: "health,info,metrics,env"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gurukul.authservice: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    org.testcontainers: INFO