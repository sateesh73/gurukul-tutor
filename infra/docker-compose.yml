# Infrastructure for gurukul-tutor services.
# Start with:  docker compose -f infra/docker-compose.yml up -d
# Stop with:   docker compose -f infra/docker-compose.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: gurukul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authdb}
      POSTGRES_USER: ${POSTGRES_USER:-authuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authpass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authuser} -d ${POSTGRES_DB:-authdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gurukul-net

volumes:
  postgres-data:

networks:
  gurukul-net:
    driver: bridge