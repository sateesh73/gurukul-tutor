services:
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=authdb
      - DB_USERNAME=authuser
      - DB_PASSWORD=authpass
      - SERVER_PORT=8080
      # Use internal container port 8080 when talking to 'keycloak' over Docker network
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      # Ensure Spring Security validates the browser-facing issuer URL while fetching keys internally
      - KEYCLOAK_ISSUER_URI=http://localhost:8081/realms/gurukul
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/realms/gurukul
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/gurukul/protocol/openid-connect/certs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gurukul-net

networks:
  gurukul-net:
    external: true
    name: gurukul-net